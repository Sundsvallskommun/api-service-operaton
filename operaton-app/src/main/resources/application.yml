#========================================
# General settings
#========================================
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
spring:
  application:
    name: api-service-operaton
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          messaging:
            authorization-grant-type: client_credentials
            provider: messaging
          support-management:
            authorization-grant-type: client_credentials
            provider: support-management
          care-management:
            authorization-grant-type: client_credentials
            provider: care-management
          financial-aid:
            authorization-grant-type: client_credentials
            provider: financial-aid
operaton:
  # Process variables whose history is never written. The SSBTEK basis carries personnummer, agency income, vehicle
  # ownership and residence-permit decisions; ACT_HI_DETAIL keeps every version of it forever and gallring does not
  # reach the engine, so it is kept out of history entirely. It also outgrew ACT_HI_DETAIL.TEXT_ (varchar(4000)),
  # which failed every fetch_ssbtek completion until this was added. See SensitiveVariableHistoryLevel.
  history:
    suppressed-variables: financialAidBasis,coApplicantFinancialAidBasis
# No admin user is configured here. The engine used to create demo/demo on every fresh database, which is a known
# login on a Cockpit reachable from outside. An environment that wants a Cockpit admin sets
# OPERATON_BPM_ADMIN_USER_ID and OPERATON_BPM_ADMIN_USER_PASSWORD (the engine creates the user once, on a database
# that lacks it); a user that already exists is left as it is.
integration:
  messaging:
    connect-timeout: 5
    read-timeout: 30
  support-management:
    connect-timeout: 5
    read-timeout: 30
  care-management:
    connect-timeout: 5
    read-timeout: 30
  financial-aid:
    connect-timeout: 5
    read-timeout: 30
scheduler:
  logger-worker:
    cron: "*/5 * * * * *"
  fetch-financial-aid-basis:
    cron: "*/5 * * * * *"
